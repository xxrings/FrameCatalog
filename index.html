<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VISN 20 Online Frame Catalog</title>
  <meta
    name="description"
    content="Browse the VISN 20 online frame catalog by style, color, material, and measurements."
  />
  <link rel="canonical" href="https://xxrings.github.io/FrameCatalog/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="VISN 20 Online Frame Catalog" />
  <meta property="og:title" content="VISN 20 Online Frame Catalog" />
  <meta property="og:description" content="Browse available frames by style, color, material, and measurements." />
  <meta property="og:url" content="https://xxrings.github.io/FrameCatalog/" />
  <meta property="og:image" content="https://xxrings.github.io/FrameCatalog/images/7012_R_55_GREY_Hero.jpg" />
  <meta property="og:image:width" content="600" />
  <meta property="og:image:height" content="253" />
  <meta property="og:image:alt" content="Eyeglass frame available in the VISN 20 Online Frame Catalog" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="VISN 20 Online Frame Catalog" />
  <meta name="twitter:description" content="Browse available frames by style, color, material, and measurements." />
  <meta name="twitter:image" content="https://xxrings.github.io/FrameCatalog/images/7012_R_55_GREY_Hero.jpg" />
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="catalog-page">
  <a class="skip-link" href="#catalog-main">Skip to catalog</a>

  <header class="site-header">
    <div class="site-header__inner">
      <p class="site-eyebrow">Current selection</p>
      <h1>Frame Catalog</h1>
      <p class="site-intro">
        Review the current frame selection by style, color, and measurements.
      </p>
      <p class="site-note">Availability is subject to change without notice.</p>
    </div>
  </header>

  <main id="catalog-main" class="catalog-shell">
    <aside class="filters-panel" aria-label="Catalog filters">
      <form id="catalog-controls" novalidate></form>
    </aside>

    <section class="results-panel" aria-labelledby="results-title">
      <div class="results-toolbar">
        <div>
          <p class="results-label">Current frame selection</p>
          <h2 id="results-title">Available frames</h2>
        </div>
        <p id="results-summary" class="results-summary" aria-live="polite"></p>
      </div>

      <div id="active-filters" class="active-filters" aria-live="polite"></div>
      <section id="thumbnails" class="catalog-grid" aria-live="polite"></section>
    </section>
  </main>

  <template id="thumbnail-template">
    <article class="catalog-card">
      <a href="#" class="catalog-card__link">
        <div class="catalog-card__media">
          <img src="" alt="" class="catalog-card__image" />
          <div class="catalog-card__status"></div>
        </div>
        <div class="catalog-card__body">
          <div class="catalog-card__eyebrow"></div>
          <h3 class="catalog-card__title"></h3>
          <p class="catalog-card__summary"></p>
          <ul class="catalog-card__facts"></ul>
          <div class="catalog-card__chips"></div>
          <p class="catalog-card__cta">View sizes and colors</p>
        </div>
      </a>
    </article>
  </template>

  <script type="module">
    import { initCatalogPage } from './js/app.js';
    window.addEventListener('DOMContentLoaded', initCatalogPage);
  </script>
</body>
</html>
