<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frame Catalog</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header>
    <h1>Frame Catalog</h1>
  </header>

  <main>
    <div class="catalog-container">
      <!-- FILTER SIDEBAR -->
      <aside id="filters"></aside>

      <!-- THUMBNAILS GRID -->
      <section id="thumbnails"></section>
    </div>
  </main>

  <!-- TEMPLATE FOR THUMBNAIL -->
  <template id="thumbnail-template">
    <div class="thumb-card">
      <a href="#" class="thumb-link">
        <div class="thumb-img-container">
          <div class="thumb-label"></div>
          <img src="" alt="Frame Image" class="thumb-img" />
        </div>
        <div class="thumb-name"></div>
      </a>
    </div>
  </template>

  <script type="module">
    import { initCatalogPage } from './js/app.js';
    window.addEventListener('DOMContentLoaded', initCatalogPage);
  </script>
</body>
</html>
